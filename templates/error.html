{% extends "base.html" %}
{% block title %}Error {{ code }} — Horizon{% endblock %}
{% block content %}
<section class="min-h-[80vh] flex items-center justify-center px-6">
  <div class="text-center max-w-sm">
    <div class="font-head text-7xl font-extrabold text-border mb-4">{{ code }}</div>
    <h1 class="text-lg font-semibold text-white mb-3">Something went wrong</h1>
    <pre class="text-xs font-mono text-rose bg-rose/5 border border-rose/20 rounded-lg px-4 py-3 mb-8 text-left whitespace-pre-wrap break-all">{{ error }}</pre>
    <a href="/" class="btn-primary">← Back to home</a>
  </div>
</section>
{% endblock %}
